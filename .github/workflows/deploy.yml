# ============================================================================
# Postavljanje sajta na hosting
#
# Okida se na svaki push na master. Pre slanja proverava da su staticke
# stranice u stan/ zaista regenerisane - da se ne bi desilo da se posalju
# stare cene i statusi u meta oznakama.
#
# Salje se SAMO ono sto sajt koristi. Interni fajlovi (README, pitanja,
# generator, izvorni JSON) ostaju van servera.
#
# Prenose se samo IZMENJENI fajlovi - akcija cuva na serveru popis stanja
# (.ftp-deploy-sync-state.json) i poredi ga pri svakom pokretanju.
#
# Podesava se u: Settings > Secrets and variables > Actions
#   tajna      FTP_PASSWORD  - lozinka FTP naloga napravljenog u WHSPanelu
#   promenljiva FTP_PROTOCOL - 'ftps' (podrazumevano) ili 'ftp' ako TLS ne radi
#   promenljiva REMOTE_PATH  - odrediste na serveru, podrazumevano './'
#                              (FTP nalog je zakljucan u folder sajta)
# ============================================================================
name: Postavi sajt

on:
  push:
    branches: [master]
  workflow_dispatch:        # dugme za rucno pokretanje

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  postavi:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi repo
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Ako neko zaboravi `node build-stanovi.js` pre commit-a, stranice u
      # stan/ nose stare podatke. Ovde se generisu ponovo i poredi - ako se
      # razlikuju, postavljanje se zaustavlja.
      # Sitemap.xml se ne poredi - nosi <lastmod> sa datumom kad je generator
      # pokrenut, pa bi se razlikovao pri svakom pushu u novom danu iako se
      # sadrzaj nije promenio.
      - name: Provera da su stranice i oznake verzija sveze
        run: |
          node build-stanovi.js
          if ! git diff --quiet -- stan/ index.html stan.html 404.html; then
            echo "::error::Generisani sadržaj nije usklađen sa izvorom."
            echo "Pokreni lokalno: node build-stanovi.js, pa commit-uj izmene."
            echo "Najčešći uzrok: promenjen je styles.css ili neki .js, a oznake"
            echo "verzija (?v=...) u HTML-u nisu osvežene - posetioci bi tada"
            echo "nastavili da koriste staru verziju iz keša."
            git diff --stat -- stan/ index.html stan.html 404.html
            exit 1
          fi
          echo "Sve je usklađeno."

      # Sklapa se folder sa tacno onim sto ide na server.
      - name: Pripremi fajlove za slanje
        run: |
          mkdir -p _deploy
          rsync -a ./ _deploy/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_deploy' \
            --exclude '.gitignore' \
            --exclude 'README.md' \
            --exclude 'pitanja.md' \
            --exclude 'build-stanovi.js' \
            --exclude 'stanovi.json' \
            --exclude 'img/stanovi' \
            --exclude 'img/garazapdf.pdf'
          echo "Fajlova za slanje: $(find _deploy -type f | wc -l)"
          du -sh _deploy

      - name: Posalji na hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: nino.webhostingsrbija.rs
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTPS je proban i server ga odbija ("500 AUTH not understood"),
          # a SSH/SFTP nije ukljucen u Start paket. Ostaje obican FTP.
          # Zato nalog 'deploy' postoji samo za ovo i zakljucan je u folder
          # sajta - lozinka koja putuje otvorenim kanalom ne otvara nista vise.
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          port: 21
          local-dir: ./_deploy/
          # FTP nalog je zakljucan u .../modusgradnja.rs/htdocs, pa mu je
          # taj folder koren - odredista nema dalje od './'
          server-dir: ${{ vars.REMOTE_PATH || './' }}
          # sam popis stanja ne treba da bude javno citljiv preko sajta
          state-name: .ftp-deploy-state.json
          dangerous-clean-slate: false
